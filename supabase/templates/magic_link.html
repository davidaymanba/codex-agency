<!doctype html>
<html lang="en">
  <body style="margin:0;background:#F2F3FF;font-family:Arial,Helvetica,sans-serif;color:#0E0F31">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #C5C6E3">
          <tr><td style="background:#0E0F31;padding:24px 32px;color:#F2F3FF;font-size:22px;font-weight:bold;letter-spacing:4px">CODEX</td></tr>
          <tr><td style="padding:32px">
            <p style="font-family:monospace;font-size:12px;color:#4B4D83;margin:0 0 12px">{ sign in }</p>
            <h1 style="font-size:22px;margin:0 0 12px">Your sign-in link</h1>
            <p style="font-size:15px;line-height:1.6;margin:0 0 24px;color:#4B4D83">Use this button to sign in to the CODEX dashboard. The link expires in one hour.</p>
            <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=magiclink" style="display:inline-block;background:#FFC100;color:#0E0F31;padding:14px 22px;font-weight:bold;text-decoration:none">Sign in · تسجيل الدخول</a>
            <p style="font-size:12px;color:#4B4D83;margin:24px 0 0">If you didn't expect this email, you can ignore it.</p>
            <p dir="rtl" style="font-size:12px;color:#4B4D83;margin:8px 0 0">إذا لم تكن تتوقع هذه الرسالة، يمكنك تجاهلها.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
